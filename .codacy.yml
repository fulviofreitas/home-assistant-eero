---
# Codacy configuration.
#
# Local CI is the source of truth for lint, typing and tests
# (pyproject.toml: ruff, mypy strict, pytest; .github/workflows/ci.yml).
# This file keeps Codacy's additional tools from flagging the test suite's
# deliberate conventions; each exclusion below states its reason.
#
# Per-engine exclusions are used instead of a global tests/** exclusion so
# that markdownlint, duplication and file metrics still cover the whole tree,
# and every engine keeps analysing custom_components/.

engines:
  # pytest requires bare `assert` (B101), and the tests feed literal
  # placeholder credentials to fake SDK sessions (B105/B106/B107). Bandit is
  # meaningful on custom_components/ only.
  bandit:
    exclude_paths:
      - "tests/**"

  # Codacy runs Pylint without pytest, Home Assistant or the eero-api SDK
  # installed, and pytest fixture injection shadows module-level fixture
  # names by design (W0621).
  pylintpython3:
    exclude_paths:
      - "tests/**"

  # Prospector re-runs Bandit (duplicating every B101) and runs pyright in a
  # container without the project's dependencies installed, so every
  # `import pytest` / `from homeassistant ...` in tests is reported as
  # unresolved.
  prospector:
    exclude_paths:
      - "tests/**"

  # Opengrep's Python rules flag `return` inside module-level lambdas (the
  # parametrize tables) and `assert` in pytest modules that do not import
  # pytest by name.
  opengrep:
    exclude_paths:
      - "tests/**"

  # Test modules scale with the integration surface they cover.
  lizard:
    exclude_paths:
      - "tests/**"
