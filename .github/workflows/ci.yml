name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3  # master, 2026-10

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration

  pytest:
    name: Pytest (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # test_hub.py measures the 1.9.3 client by checking it out of
          # history, so this job needs more than the tip commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      # tests/ha needs Home Assistant >= 2026.3, which needs Python 3.14;
      # pyproject.toml's addopts already ignores it for a bare `pytest -q`.
      - run: pytest -q

  pytest-ha:
    name: Pytest HA ${{ matrix.homeassistant }} (3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum declared in hacs.json, and the version the
          # requirements file pins.
          - homeassistant: "2026.8.0"
            phcc: "0.13.354"
          - homeassistant: "2026.10.0"
            phcc: "0.13.371"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test_ha.txt
      - run: pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      - run: python -c "import homeassistant.const as c; assert c.__version__ == '${{ matrix.homeassistant }}', c.__version__"
      - run: pytest -q tests/ha

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test_ha.txt
      - run: mypy custom_components/eero
